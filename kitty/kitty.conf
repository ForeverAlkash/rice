# kitty — Prism starter config (installed by ~/.config/quickshell/install.sh)
# Colours are static (see prism-colors.conf). Docs: https://sw.kovidgoyal.net/kitty/conf/

# Prism palette off — kitty uses its base colours. Re-enable with:
# include prism-colors.conf

font_family          JetBrainsMono Nerd Font
font_size            11.0

background_opacity   0.85
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
# Hyprland sizes the windows; remembering them makes kitty reopen maximized
# once a maximized window has been closed
remember_window_size no

cursor_shape         beam
cursor_trail         1
scrollback_lines     5000
enable_audio_bell    no

tab_bar_style        powerline
tab_powerline_style  round
